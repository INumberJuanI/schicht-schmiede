name: CI/CD Pipeline - Service Deployment

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:
    inputs:
      release_prod:
        description: 'PROD Live-System updaten? (ja/nein)'
        required: true
        default: 'nein'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # 1. JOB: DOCKER IMAGE BAUEN & IN DIE REGISTRY PUSHEN
  # =========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker Tag based on Branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=test" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 2. JOB: DEPLOYMENT AUF DEM VPS & AUTOMATISCHER DATEN-KLON
  # =========================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /apps/${{ github.event.repository.name }}
            
            # Docker Registry Login auf dem VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Falls Branch = test -> Nur Test-Umgebung aktualisieren
            if [ "${{ github.ref_name }}" = "test" ]; then
              docker compose pull app-test
              docker compose up -d postgres-db-test app-test
            fi

            # Falls Branch = main -> Acceptance aktualisieren + Live-Daten klonen!
            if [ "${{ github.ref_name }}" = "main" ]; then
              
              echo ">>> Triggere automatischen Live-Daten-Klon für die Acceptance-Umgebung..."
              
              # 1. Live-Datenbank in Host-Dateisystem dumpen
              docker exec -t ${{ secrets.CUSTOMER_NAME }}-db-live pg_dump -U postgres ${{ secrets.PROD_DB_NAME }} > /tmp/live_dump.sql
              
              # 2. Acceptance-Datenbank restlos zurücksetzen & neu anlegen
              docker exec -t ${{ secrets.CUSTOMER_NAME }}-db-accept dropdb -U postgres --if-exists ${{ secrets.ACCEPT_DB_NAME }}
              docker exec -t ${{ secrets.CUSTOMER_NAME }}-db-accept createdb -U postgres ${{ secrets.ACCEPT_DB_NAME }}
              
              # 3. Live-Dump in die leere Acceptance-Datenbank einspielen
              cat /tmp/live_dump.sql | docker exec -i ${{ secrets.CUSTOMER_NAME }}-db-accept psql -U postgres -d ${{ secrets.ACCEPT_DB_NAME }}
              rm /tmp/live_dump.sql
              
              # 4. Live-Medien (Bilder) via rsync spiegeln
              rsync -av --delete ./app-prod/media/ ./app-acceptance/media/

              # 5. Acceptance-App mit dem frischen Image hochziehen
              docker compose pull app-acceptance
              docker compose up -d postgres-db-acceptance app-acceptance
              echo ">>> Klonen abgeschlossen. Acceptance-Umgebung ist bereit für Kundentests!"
            fi

  # =========================================================================
  # 3. JOB: MANUELLER GO-LIVE (PROD-UMGEBUNG AKTIVIEREN)
  # =========================================================================
  go-live-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_prod == 'ja'
    
    steps:
      - name: Live-Schaltung auf dem VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /apps/${{ github.event.repository.name }}
            echo ">>> Schalte das getestete Image live auf der Produktions-Umgebung..."
            docker compose pull app-prod
            docker compose up -d postgres-db-live app-prod
            echo ">>> GO LIVE ERFOLGREICH! System läuft auf Port ${{ secrets.PROD_APP_PORT }}."